<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>HomeSort</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #171717;
      --muted: #777;
      --line: #e5e5e7;
      --accent: #1677ff;
      --nav: rgba(255,255,255,.94);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; }
    body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 760px; margin: 0 auto; }
    header { padding: calc(18px + env(safe-area-inset-top)) 18px 10px; }
    header h1 { margin: 0; font-size: 30px; letter-spacing: -.6px; }
    header p { margin: 4px 0 0; color: var(--muted); }
    main { padding: 0 14px; }
    .section { margin: 16px 0 24px; }
    .section-title { display:flex; align-items:center; justify-content:space-between; margin: 0 4px 9px; }
    .section-title h2 { margin:0; font-size:18px; }
    .add-btn { border:0; background:var(--accent); color:#fff; width:38px; height:38px; border-radius:19px; font-size:24px; line-height:1; }
    .card { background:var(--card); border-radius:16px; border:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.03); overflow:hidden; }
    .empty { padding:28px 18px; text-align:center; color:var(--muted); }
    .item { display:flex; gap:12px; padding:14px 15px; border-bottom:1px solid var(--line); }
    .item:last-child { border-bottom:0; }
    .icon { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:#eef3ff; flex:0 0 auto; }
    .item-body { min-width:0; flex:1; }
    .item-title { font-weight:650; margin-bottom:4px; }
    .item-meta { color:var(--muted); font-size:13px; }
    .shared { color:var(--muted); font-size:12px; margin-top:5px; }
    .feed-comment { margin-top:9px; padding:9px 10px; background:#f5f5f7; border-radius:10px; font-size:13px; }
    .feed-comment b { font-weight:650; }
    .nav { position:fixed; left:0; right:0; bottom:0; z-index:20; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:var(--nav); border-top:1px solid var(--line); backdrop-filter:blur(16px); }
    .nav-inner { max-width:760px; margin:auto; display:grid; grid-template-columns:repeat(5,1fr); }
    .nav button { border:0; background:none; color:#777; padding:5px 0; font-size:11px; }
    .nav button.active { color:var(--accent); font-weight:650; }
    .nav-icon { display:block; font-size:21px; line-height:23px; margin-bottom:2px; }
    .view { display:none; }
    .view.active { display:block; }
    .toolbar { display:flex; gap:8px; align-items:center; margin:10px 0 14px; }
    .toolbar button { border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 12px; }
    .date-label { flex:1; font-weight:650; }
    .modal-backdrop { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.35); display:none; align-items:flex-end; }
    .modal-backdrop.open { display:flex; }
    .modal { width:100%; max-width:760px; margin:auto; background:#fff; border-radius:22px 22px 0 0; padding:18px; padding-bottom:calc(22px + env(safe-area-inset-bottom)); }
    .modal h2 { margin:0 0 15px; }
    label { display:block; margin:12px 0 6px; font-size:13px; color:var(--muted); }
    input, select { width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; }
    .form-actions { display:flex; gap:10px; margin-top:18px; }
    .form-actions button { flex:1; padding:12px; border-radius:12px; border:0; }
    .cancel { background:#eee; }
    .save { background:var(--accent); color:#fff; }
    .calendar-grid { background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px; }
    .calendar-grid input { margin-bottom:12px; }
    .calendar-day { padding:12px 0; border-top:1px solid var(--line); }
    .timer-number { font-size:27px; font-weight:700; letter-spacing:-.5px; }
    .small { color:var(--muted); font-size:13px; }
    .settings-row { display:flex; align-items:center; justify-content:space-between; padding:15px; border-bottom:1px solid var(--line); }
    .settings-row:last-child { border-bottom:0; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="pageTitle">HomeSort</h1>
    <p id="pageSubtitle"></p>
  </header>

  <main>
    <section id="homeView" class="view active">
      <div class="section">
        <div class="section-title"><h2>Today</h2><button class="add-btn" onclick="openAdd()">+</button></div>
        <div id="todayList" class="card"></div>
      </div>
      <div class="section">
        <div class="section-title"><h2>Activity</h2></div>
        <div id="activityList" class="card"></div>
      </div>
    </section>

    <section id="calendarView" class="view">
      <div class="section">
        <div class="toolbar">
          <button onclick="changeDate(-1)">‹</button>
          <div id="calendarDateLabel" class="date-label"></div>
          <button onclick="changeDate(1)">›</button>
          <button onclick="goToday()">Today</button>
        </div>
        <div class="calendar-grid">
          <input id="calendarDate" type="date" onchange="selectDate(this.value)">
          <div id="calendarItems"></div>
        </div>
      </div>
    </section>

    <section id="remindersView" class="view">
      <div class="section">
        <div class="section-title"><h2>Reminders</h2><button class="add-btn" onclick="openAdd('reminder')">+</button></div>
        <div id="reminderList" class="card"></div>
      </div>
    </section>

    <section id="timersView" class="view">
      <div class="section">
        <div class="section-title"><h2>Timers</h2><button class="add-btn" onclick="openAdd('timer')">+</button></div>
        <div id="timerList" class="card"></div>
      </div>
    </section>

    <section id="settingsView" class="view">
      <div class="section">
        <div class="card">
          <div class="settings-row"><span>Account</span><span class="small">Not connected yet</span></div>
          <div class="settings-row"><span>Notifications</span><span class="small">Coming next</span></div>
          <div class="settings-row"><span>Family sharing</span><span class="small">Coming next</span></div>
          <div class="settings-row"><span>Version</span><span class="small">0.1 prototype</span></div>
        </div>
      </div>
    </section>
  </main>
</div>

<nav class="nav">
  <div class="nav-inner">
    <button class="active" onclick="showView('home',this)"><span class="nav-icon">⌂</span>Home</button>
    <button onclick="showView('calendar',this)"><span class="nav-icon">▣</span>Calendar</button>
    <button onclick="showView('reminders',this)"><span class="nav-icon">◉</span>Reminders</button>
    <button onclick="showView('timers',this)"><span class="nav-icon">◷</span>Timers</button>
    <button onclick="showView('settings',this)"><span class="nav-icon">⚙</span>Settings</button>
  </div>
</nav>

<div id="modalBackdrop" class="modal-backdrop" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>Add to HomeSort</h2>
    <label for="itemTitle">Title</label>
    <input id="itemTitle" placeholder="What do you need to remember?">
    <label for="itemType">Type</label>
    <select id="itemType">
      <option value="reminder">Reminder</option>
      <option value="calendar">Calendar event</option>
      <option value="timer">Timer</option>
    </select>
    <label for="itemDate">Date & time</label>
    <input id="itemDate" type="datetime-local">
    <label for="itemShared">Sharing</label>
    <select id="itemShared">
      <option value="shared">Shared with Larissa</option>
      <option value="private">Private</option>
    </select>
    <div class="form-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" onclick="saveItem()">Add</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "homesort-items-v1";
let selectedDate = new Date();

const sampleItems = [
  {id: crypto.randomUUID(), title:"Welcome to HomeSort", type:"reminder", date:new Date().toISOString(), shared:true, createdAt:new Date().toISOString(), comments:[]}
];

function loadItems() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(saved) ? saved : sampleItems;
  } catch { return sampleItems; }
}
let items = loadItems();

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function typeIcon(type) {
  return type === "calendar" ? "▣" : type === "timer" ? "◷" : "◉";
}

function typeName(type) {
  return type === "calendar" ? "Calendar" : type === "timer" ? "Timer" : "Reminder";
}

function formatDateTime(iso) {
  return new Date(iso).toLocaleString([], {weekday:"short", day:"numeric", month:"short", hour:"numeric", minute:"2-digit"});
}

function renderItem(item) {
  const comments = item.comments || [];
  return `<div class="item">
    <div class="icon">${typeIcon(item.type)}</div>
    <div class="item-body">
      <div class="item-title">${escapeHtml(item.title)}</div>
      <div class="item-meta">${typeName(item.type)} · ${formatDateTime(item.date)}</div>
      <div class="shared">${item.shared ? "Shared with Larissa" : "Private"}</div>
      ${comments.length ? `<div class="feed-comment"><b>Discussion</b><br>${escapeHtml(comments[comments.length-1].text)}</div>` : ""}
    </div>
  </div>`;
}

function render() {
  const today = items.filter(i => isSameDay(new Date(i.date), new Date())).sort((a,b)=>new Date(a.date)-new Date(b.date));
  document.getElementById("todayList").innerHTML = today.length ? today.map(renderItem).join("") : `<div class="empty">Nothing scheduled for today.</div>`;

  const activity = [...items].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  document.getElementById("activityList").innerHTML = activity.length ? activity.slice(0,10).map(renderItem).join("") : `<div class="empty">No activity yet.</div>`;

  const reminders = items.filter(i=>i.type==="reminder").sort((a,b)=>new Date(a.date)-new Date(b.date));
  document.getElementById("reminderList").innerHTML = reminders.length ? reminders.map(renderItem).join("") : `<div class="empty">No reminders yet.</div>`;

  const timers = items.filter(i=>i.type==="timer").sort((a,b)=>new Date(a.date)-new Date(b.date));
  document.getElementById("timerList").innerHTML = timers.length ? timers.map(renderTimer).join("") : `<div class="empty">No timers yet.</div>`;

  renderCalendar();
  document.getElementById("pageSubtitle").textContent = new Date().toLocaleDateString([], {weekday:"long", day:"numeric", month:"long"});
}

function renderTimer(item) {
  const target = new Date(item.date);
  const diff = target - new Date();
  const abs = Math.abs(diff);
  const d = Math.floor(abs / 86400000);
  const h = Math.floor((abs % 86400000)/3600000);
  const m = Math.floor((abs % 3600000)/60000);
  const label = diff >= 0 ? "Countdown" : "Since";
  return `<div class="item">
    <div class="icon">◷</div>
    <div class="item-body">
      <div class="item-title">${escapeHtml(item.title)}</div>
      <div class="timer-number">${d}d ${h}h ${m}m</div>
      <div class="item-meta">${label} · ${formatDateTime(item.date)}</div>
      <div class="shared">${item.shared ? "Shared with Larissa" : "Private"}</div>
    </div>
  </div>`;
}

function isSameDay(a,b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function showView(name, button) {
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(name+"View").classList.add("active");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  document.getElementById("pageTitle").textContent = name === "home" ? "HomeSort" : name.charAt(0).toUpperCase()+name.slice(1);
  render();
}

function openAdd(type) {
  document.getElementById("modalBackdrop").classList.add("open");
  document.getElementById("itemType").value = type || "reminder";
  const d = new Date(Date.now()+3600000);
  d.setSeconds(0,0);
  document.getElementById("itemDate").value = new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  document.getElementById("itemTitle").focus();
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
}

function saveItem() {
  const title = document.getElementById("itemTitle").value.trim();
  if (!title) return;
  const local = document.getElementById("itemDate").value;
  const item = {
    id: crypto.randomUUID(),
    title,
    type: document.getElementById("itemType").value,
    date: new Date(local).toISOString(),
    shared: document.getElementById("itemShared").value === "shared",
    createdAt: new Date().toISOString(),
    comments:[]
  };
  items.unshift(item);
  persist();
  document.getElementById("itemTitle").value = "";
  closeModal();
  render();
}

function renderCalendar() {
  const iso = selectedDate.toISOString().slice(0,10);
  document.getElementById("calendarDate").value = iso;
  document.getElementById("calendarDateLabel").textContent = selectedDate.toLocaleDateString([], {weekday:"long", day:"numeric", month:"long"});
  const dayItems = items.filter(i=>isSameDay(new Date(i.date), selectedDate)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  document.getElementById("calendarItems").innerHTML = dayItems.length ? dayItems.map(renderItem).join("") : `<div class="calendar-day small">Nothing scheduled.</div>`;
}

function changeDate(delta) {
  selectedDate.setDate(selectedDate.getDate()+delta);
  renderCalendar();
}
function goToday() { selectedDate = new Date(); renderCalendar(); }
function selectDate(value) { selectedDate = new Date(value+"T12:00:00"); renderCalendar(); }

setInterval(render, 30000);
render();
</script>
</body>
</html>
